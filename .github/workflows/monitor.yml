name: 生产健康检查

on:
  schedule:
    # 每 15 分钟一次（GitHub 定时任务在高峰期可能延迟数分钟）
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_URL: https://atlas.sololeveling.top
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: 检查生产健康、关键页面与 SEO
        run: node scripts/monitor.mjs
