name: 生产健康检查

on:
  schedule:
    # 每 15 分钟一次（GitHub 定时任务在高峰期可能延迟数分钟）
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: https://atlas.sololeveling.top
    steps:
      - name: 检查 /api/health
        run: |
          set -uo pipefail
          body="$(curl -fsS --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors "$SITE_URL/api/health" 2>&1)"
          status=$?
          {
            echo "## 生产健康检查"
            echo ""
            echo "- 目标：\`$SITE_URL/api/health\`"
            echo "- 时间（UTC）：$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- curl 退出码：$status"
            echo "- 响应：\`$body\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "健康检查失败：$body" >&2
            exit 1
          fi
          echo "$body" | grep -q '"status":"ok"' || {
            echo "健康检查响应异常：$body" >&2
            exit 1
          }
      - name: 检查关键页面与 SEO
        run: |
          set -uo pipefail
          for path in / /sitemap.xml /robots.txt; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors "https://atlas.sololeveling.top$path" || echo 000)"
            echo "- \`$path\` → $code" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" != "200" ]; then
              echo "$path 返回 $code" >&2
              exit 1
            fi
          done
